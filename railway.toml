[build]
builder = "NIXPACKS"

# Nixpacks elige el provider mirando qué archivos hay en el repo, y encuentra
# package.json (que existe solo para compilar el CSS de Tailwind en desarrollo:
# el CSS ya compilado viaja en static/). Con eso arma una imagen de Node, corre
# `npm ci` y no instala Python — el contenedor arranca y falla con
# `python: command not found`. .railwayignore no ayuda: solo aplica a
# `railway up` desde el CLI, no al build desde GitHub.
[build.nixpacksPlan]
providers = ["python"]

[deploy]
# Shell de login + PATH explícito del venv: la imagen de Nixpacks instala las
# dependencias en /opt/venv y agrega ese PATH a /root/.profile, pero el
# startCommand corre en una shell no interactiva que no lo lee. Sin esto:
#   /bin/bash: line 1: python: command not found
startCommand = "bash -lc 'export PATH=/opt/venv/bin:$PATH; python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
